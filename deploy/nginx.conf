# Reverse proxy para Zane Barber Studio.
# Instalar:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/zane-barber
#            sudo ln -s /etc/nginx/sites-available/zane-barber /etc/nginx/sites-enabled/
#            sudo rm -f /etc/nginx/sites-enabled/default
#            sudo nginx -t && sudo systemctl reload nginx
#
# Después, certbot reescribe este archivo para añadir el bloque HTTPS:
#            sudo certbot --nginx -d tu-dominio.com
#
# Reemplaza TU_DOMINIO por el dominio real antes de instalar.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # SSE del tablero de turnos: sin buffering y sin timeout corto, si no la
    # conexión se corta a los pocos segundos y el panel queda "reconectando".
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 2m;  # deja margen sobre el 1mb de express.json (fotos del kiosco)
}
